    <text x="80" y="185" fill="#e8edf7" font-size="58" font-weight="700">Software that keeps working</text>
    <text x="80" y="255" fill="url(#ink)" font-size="58" font-weight="700">when things go wrong.</text>

    <g font-size="30">
