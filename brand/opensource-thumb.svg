    <linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#8ef5d4"/><stop offset="1" stop-color="#6aa6ff"/></linearGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
